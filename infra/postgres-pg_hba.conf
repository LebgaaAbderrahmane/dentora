# Dentora pg_hba.conf — mounted read-only and selected via `hba_file`.
# Keeps the official-image defaults and adds replication access so the
# backup script can run `pg_basebackup` for PITR anchors.
local   all             all                                     trust
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
host    replication     all             0.0.0.0/0               scram-sha-256
host    replication     all             ::/0                    scram-sha-256
